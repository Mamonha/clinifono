server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 192.168.100.132;
    ssl_certificate /etc/ssl/CA/wildcard.crt;
    ssl_certificate_key /etc/ssl/CA/wildcard.key;

    http2 on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "frame-ancestors 'none';";
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    server_tokens off;
    proxy_hide_header X-Powered-By;

    # Serve o index corretamente ao acessar https://IP/
    root /var/app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /clinifono/ {
        alias /opt/dist/coreui-free-angular-admin-template/browser/;
        index index.html;
        try_files $uri $uri/ /index.html =404;
        access_log /var/log/nginx/frontend_access.log;
        error_log /var/log/nginx/frontend_error.log;
    }

    location /clinifono-0.0.1-SNAPSHOT/api {
        proxy_pass https://192.168.100.100:8443;

	# Para nao perder o Host Origem;
	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /404.html {
        internal;
    }
}

# Redirecionamento de HTTP para HTTPS (opcional, desabilite para testar)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.168.10.2; 

    return 301 https://$host$request_uri;
}
