services:
  frontend-c1:
    build: .
    container_name: frontend-c1
    ports:
      - "4443:443"
      - "8080:80"
    volumes:
      - ./logs/nginx-c1:/var/log/nginx
    restart: unless-stopped
    networks:
      - elastic
  frontend-c2:
    build: .
    container_name: frontend-c2
    ports:
      - "4444:443"
      - "8081:80"
    volumes:
      - ./logs/nginx-c2:/var/log/nginx
    restart: unless-stopped
    networks:
      - elastic
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Isso desativa a autenticação para local, depois remover
      - ES_JAVA_OPTS=-Xms1g -Xmx1g  
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic
    restart: unless-stopped
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elastic
    restart: unless-stopped
  filebeat:
    build:
      context: .
      dockerfile: Dockerfile.filebeat
    container_name: filebeat
    user: root
    depends_on:
      - elasticsearch
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs/nginx-c1:/var/log/nginx-c1:ro
      - ./logs/nginx-c2:/var/log/nginx-c2:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elastic
    restart: unless-stopped

volumes:
  logs-c1:
  logs-c2:
  es_data: # Talvez remover depois

networks:
  elastic: 
    driver: bridge